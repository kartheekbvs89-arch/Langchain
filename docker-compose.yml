# ============================================================
# Enterprise Knowledge Assistant — Full-stack docker-compose
# Brings up: backend (FastAPI) + frontend (nginx) on one host
# ============================================================

version: "3.9"

services:
  # ---------- Backend (FastAPI + LangChain + Chroma) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eka-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=prod
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:8000,http://localhost:8080,http://127.0.0.1:8080
      # OpenAI (optional — leave blank to use local TemplateLLM)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      # LangSmith tracing (optional)
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-enterprise-knowledge-assistant}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      # Persist Chroma DB across restarts
      - backend-data:/app/data/chroma_db
      - backend-uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - eka-net

  # ---------- Frontend (nginx serving static HTML/CSS/JS) ----------
  frontend:
    image: nginx:alpine
    container_name: eka-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eka-net

volumes:
  backend-data:
  backend-uploads:

networks:
  eka-net:
    driver: bridge
