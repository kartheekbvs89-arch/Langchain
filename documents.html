<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents · Enterprise Knowledge Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <script src="js/app.js"></script>
  <script>
    const MOCK_DOCS = [
      { name: 'HR_Policy_Manual_2024.pdf', type: 'pdf', agent: 'HR', size: '2.4 MB', uploaded: 'Aug 12, 2026', status: 'indexed', chunks: 184 },
      { name: 'Leave_Policy.docx',          type: 'docx', agent: 'HR', size: '180 KB', uploaded: 'Aug 10, 2026', status: 'indexed', chunks: 23 },
      { name: 'Payroll_Procedure.docx',     type: 'docx', agent: 'HR', size: '342 KB', uploaded: 'Aug 10, 2026', status: 'indexed', chunks: 41 },
      { name: 'Onboarding_Checklist.pdf',    type: 'pdf',  agent: 'HR', size: '640 KB', uploaded: 'Aug 09, 2026', status: 'indexed', chunks: 12 },
      { name: 'IT_SOP_PasswordReset.pdf',    type: 'pdf',  agent: 'IT', size: '1.1 MB', uploaded: 'Aug 11, 2026', status: 'indexed', chunks: 28 },
      { name: 'IT_Network_Guide_v2.pdf',     type: 'pdf',  agent: 'IT', size: '3.2 MB', uploaded: 'Aug 11, 2026', status: 'indexed', chunks: 156 },
      { name: 'Asset_Policy.docx',           type: 'docx', agent: 'IT', size: '220 KB', uploaded: 'Aug 08, 2026', status: 'indexed', chunks: 18 },
      { name: 'Software_Whitelist.txt',      type: 'txt',  agent: 'IT', size: '94 KB',  uploaded: 'Aug 14, 2026', status: 'processing', chunks: 0 },
      { name: 'InfoSec_Policy_v4.pdf',       type: 'pdf',  agent: 'Policy', size: '4.1 MB', uploaded: 'Aug 07, 2026', status: 'indexed', chunks: 212 },
      { name: 'Code_of_Conduct_2024.pdf',    type: 'pdf',  agent: 'Policy', size: '1.8 MB', uploaded: 'Aug 07, 2026', status: 'indexed', chunks: 88 },
      { name: 'Hybrid_Work_Policy_2024.pdf', type: 'pdf',  agent: 'Policy', size: '420 KB', uploaded: 'Aug 06, 2026', status: 'indexed', chunks: 22 },
      { name: 'Security_Incident_Response.pdf', type: 'pdf', agent: 'Policy', size: '2.0 MB', uploaded: 'Aug 14, 2026', status: 'processing', chunks: 0 },
      { name: 'Vendor_Compliance_2024.docx', type: 'docx', agent: 'Policy', size: '760 KB', uploaded: 'Aug 05, 2026', status: 'failed', chunks: 0 },
    ];

    let filterAgent = 'all';
    let searchQuery = '';

    function fileIcon(type) {
      return `<div class="file-icon ${type}">${type.toUpperCase()}</div>`;
    }

    function agentBadge(agent) {
      const cls = agent.toLowerCase();
      return `<span class="badge badge-${cls}">${agent}</span>`;
    }

    function renderDocumentsPage() {
      const stats = computeStats();
      const mainContent = `
        <div class="page">
          <div class="page-header flex items-center justify-between">
            <div>
              <h1>Documents</h1>
              <p>Manage documents indexed in the vector database. Each document is chunked and embedded for retrieval.</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Upload document
            </button>
            <input type="file" id="fileInput" class="hidden" onchange="handleUpload(event)" />
          </div>

          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <div class="stat-label">Total documents</div>
              <div class="stat-value">${stats.total}</div>
              <div class="stat-delta up"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 4 20 16 4 16"/></svg>${stats.indexed} indexed · ${stats.processing} processing · ${stats.failed} failed</div>
            </div>
            <div class="stat-card accent">
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
              </div>
              <div class="stat-label">Total chunks</div>
              <div class="stat-value">${stats.chunks.toLocaleString()}</div>
              <div class="stat-delta">~512 tokens per chunk</div>
            </div>
            <div class="stat-card success">
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              </div>
              <div class="stat-label">Storage used</div>
              <div class="stat-value">${stats.storage}</div>
              <div class="stat-delta">Across 3 agent namespaces</div>
            </div>
            <div class="stat-card warning">
              <div class="stat-card-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <div class="stat-label">Avg embeddings</div>
              <div class="stat-value">${stats.avgEmb}</div>
              <div class="stat-delta">all-MiniLM-L6-v2 · 384-dim</div>
            </div>
          </div>

          <div class="grid grid-cols-3 mb-6">
            <div class="card card-hover">
              <div class="card-header">
                <span class="card-title">HR knowledge base</span>
                <span class="badge badge-hr">${stats.byAgent.HR} docs</span>
              </div>
              <div class="progress mb-4"><div class="progress-bar" style="width:${(stats.byAgent.HR/13)*100}%"></div></div>
              <div class="text-muted" style="font-size:0.75rem;">HR_Policy_Manual, Leave, Payroll, Onboarding</div>
            </div>
            <div class="card card-hover">
              <div class="card-header">
                <span class="card-title">IT knowledge base</span>
                <span class="badge badge-it">${stats.byAgent.IT} docs</span>
              </div>
              <div class="progress mb-4"><div class="progress-bar" style="width:${(stats.byAgent.IT/13)*100}%; background: linear-gradient(135deg, #6366F1, #8B5CF6);"></div></div>
              <div class="text-muted" style="font-size:0.75rem;">SOPs, Network guides, Asset policy</div>
            </div>
            <div class="card card-hover">
              <div class="card-header">
                <span class="card-title">Policy knowledge base</span>
                <span class="badge badge-policy">${stats.byAgent.Policy} docs</span>
              </div>
              <div class="progress mb-4"><div class="progress-bar" style="width:${(stats.byAgent.Policy/13)*100}%; background: linear-gradient(135deg, #14B8A6, #06B6D4);"></div></div>
              <div class="text-muted" style="font-size:0.75rem;">InfoSec, Code of Conduct, Hybrid Work</div>
            </div>
          </div>

          <div class="card mb-6">
            <div class="card-header">
              <span class="card-title">Upload new document</span>
              <span class="text-muted" style="font-size:0.75rem;">PDF · DOCX · TXT · MD · max 25 MB</span>
            </div>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
              <div class="upload-zone-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </div>
              <h4>Drop a file here or click to browse</h4>
              <p>Documents are chunked, embedded, and stored in the agent-specific vector namespace.</p>
            </div>
            <div class="form-group" style="margin-top:var(--space-4); margin-bottom:0;">
              <label class="form-label">Assign to agent namespace</label>
              <select class="form-select" id="uploadAgent" style="max-width:240px;">
                <option value="hr">HR Agent</option>
                <option value="it">IT Agent</option>
                <option value="policy">Policy Agent</option>
              </select>
            </div>
          </div>

          <div class="doc-table-wrap">
            <div class="filter-bar">
              <div class="search-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" placeholder="Search documents..." id="searchInput" oninput="onSearch(event)" />
              </div>
              <div class="flex gap-2">
                <button class="btn btn-sm ${filterAgent === 'all' ? 'btn-primary' : 'btn-secondary'}" onclick="setFilter('all')">All</button>
                <button class="btn btn-sm ${filterAgent === 'hr' ? 'btn-primary' : 'btn-secondary'}" onclick="setFilter('HR')">HR</button>
                <button class="btn btn-sm ${filterAgent === 'it' ? 'btn-primary' : 'btn-secondary'}" onclick="setFilter('IT')">IT</button>
                <button class="btn btn-sm ${filterAgent === 'policy' ? 'btn-primary' : 'btn-secondary'}" onclick="setFilter('Policy')">Policy</button>
              </div>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th>Document</th>
                  <th>Agent</th>
                  <th>Size</th>
                  <th>Chunks</th>
                  <th>Status</th>
                  <th>Uploaded</th>
                  <th style="width:80px;"></th>
                </tr>
              </thead>
              <tbody id="docTbody">
                ${renderDocRows()}
              </tbody>
            </table>
            <div class="p-4 text-muted" style="font-size:0.75rem; text-align:center;">
              Showing ${filteredDocs().length} of ${MOCK_DOCS.length} documents · Phase 1 mock data
            </div>
          </div>
        </div>
      `;

      mountShell('documents', 'Documents', 'Home / Workspace / Documents', mainContent, '');

      const zone = document.getElementById('uploadZone');
      if (zone) {
        ['dragenter', 'dragover'].forEach(evt => {
          zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(evt => {
          zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
        });
        zone.addEventListener('drop', (e) => {
          const file = e.dataTransfer.files[0];
          if (file) showToast(`"${file.name}" queued for upload to ${document.getElementById('uploadAgent').value.toUpperCase()} namespace`, 'info');
        });
      }
    }

    function computeStats() {
      const indexed = MOCK_DOCS.filter(d => d.status === 'indexed').length;
      const processing = MOCK_DOCS.filter(d => d.status === 'processing').length;
      const failed = MOCK_DOCS.filter(d => d.status === 'failed').length;
      const chunks = MOCK_DOCS.reduce((sum, d) => sum + d.chunks, 0);
      const storageMB = MOCK_DOCS.reduce((sum, d) => {
        const mb = parseFloat(d.size);
        return sum + (isNaN(mb) ? 0 : mb);
      }, 0);
      return {
        total: MOCK_DOCS.length,
        indexed, processing, failed,
        chunks,
        storage: storageMB.toFixed(1) + ' MB',
        avgEmb: chunks.toLocaleString(),
        byAgent: {
          HR: MOCK_DOCS.filter(d => d.agent === 'HR').length,
          IT: MOCK_DOCS.filter(d => d.agent === 'IT').length,
          Policy: MOCK_DOCS.filter(d => d.agent === 'Policy').length,
        },
      };
    }

    function filteredDocs() {
      return MOCK_DOCS.filter(d => {
        if (filterAgent !== 'all' && d.agent !== filterAgent) return false;
        if (searchQuery && !d.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });
    }

    function renderDocRows() {
      return filteredDocs().map(d => `
        <tr>
          <td>
            <div class="flex items-center gap-3">
              ${fileIcon(d.type)}
              <div>
                <div style="font-weight:600; color:var(--color-text);">${d.name}</div>
                <div class="text-muted" style="font-size:0.6875rem;">${d.type.toUpperCase()} document</div>
              </div>
            </div>
          </td>
          <td>${agentBadge(d.agent)}</td>
          <td class="text-mono" style="font-size:0.8125rem; color:var(--color-text-secondary);">${d.size}</td>
          <td class="text-mono" style="font-size:0.8125rem; color:var(--color-text-secondary);">${d.chunks || '—'}</td>
          <td>
            <span class="status-pill ${d.status}">
              <span class="badge-dot ${d.status === 'indexed' ? 'active' : ''}"></span>
              ${d.status}
            </span>
          </td>
          <td style="font-size:0.8125rem; color:var(--color-text-muted);">${d.uploaded}</td>
          <td>
            <button class="btn-icon" title="Re-index" onclick="showToast('Re-indexing ${d.name}...', 'info')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
            <button class="btn-icon" title="Delete" onclick="showToast('Deleted ${d.name}', 'error')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function setFilter(agent) {
      filterAgent = agent;
      document.getElementById('docTbody').innerHTML = renderDocRows();
      const buttons = document.querySelectorAll('.filter-bar .btn');
      buttons.forEach(b => {
        const txt = b.textContent.trim();
        const isActive = (agent === 'all' && txt === 'All') ||
                         (agent === 'HR' && txt === 'HR') ||
                         (agent === 'IT' && txt === 'IT') ||
                         (agent === 'Policy' && txt === 'Policy');
        b.className = 'btn btn-sm ' + (isActive ? 'btn-primary' : 'btn-secondary');
      });
    }

    function onSearch(e) {
      searchQuery = e.target.value;
      document.getElementById('docTbody').innerHTML = renderDocRows();
    }

    function handleUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const agent = document.getElementById('uploadAgent').value.toUpperCase();
      showToast(`"${file.name}" (${(file.size/1024/1024).toFixed(2)} MB) uploaded to ${agent} namespace — indexing...`, 'info');
      e.target.value = '';
    }

    function showToast(msg, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const icon = type === 'success' ? '<polyline points="20 6 9 17 4 12"/>' :
                   type === 'error' ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' :
                   '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">${icon}</svg>
        </div>
        <span style="font-size:0.875rem; font-weight:500;">${msg}</span>
      `;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        toast.style.transition = 'all 300ms';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    renderDocumentsPage();
  </script>
</body>
</html>
