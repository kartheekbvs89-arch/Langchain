                <span class="text-muted" style="font-size:0.75rem;">Eval set: 200 questions · LLM-as-judge + human spot-check</span>

                <thead>

                    <tr>

          <!-- Eval table -->
          <div class="chart-card">
            <div class="card-header">

            </div>
            <table class="table">
              <thead>

                  <th>Answer Relevancy</th>

              </thead>
              <tbody>
                <tr><td><span class="badge badge-hr">HR</span></td><td class="text-mono">0.92</td><td class="text-mono">0.88</td><td class="text-mono">0.86</td><td class="text-mono">0.91</td><td><span class="badge badge-success">89.3%</span></td></tr>
                <tr><td><span class="badge badge-it">IT</span></td><td class="text-mono">0.89</td><td class="text-mono">0.91</td><td class="text-mono">0.83</td><td class="text-mono">0.87</td><td><span class="badge badge-success">87.5%</span></td></tr>
                <tr><td><span class="badge badge-policy">Policy</span></td><td class="text-mono">0.94</td><td class="text-mono">0.86</td><td class="text-mono">0.90</td><td class="text-mono">0.93</td><td><span class="badge badge-success">90.8%</span></td></tr>
                <tr style="font-weight:700;"><td>Overall</td><td class="text-mono">0.917</td><td class="text-mono">0.883</td><td class="text-mono">0.863</td><td class="text-mono">0.903</td><td><span class="badge badge-primary">89.2%</span></td></tr>
              </tbody>
            </table>
            <p class="text-muted" style="font-size:0.75rem; margin-top:var(--space-4);">
              Faithfulness measures grounding in retrieved context. Answer Relevancy measures how directly the answer addresses the query. Context Precision/Recall evaluate chunk retrieval quality. Phase 2 displays pre-computed mock metrics; live evaluation pipeline ships in Phase 3.
            </p>
          </div>

          <!-- Tech stack card -->
          <div class="card mt-6">
            <div class="flex items-center justify-between">

                <h6 style="margin-bottom:var(--space-2);">Project</h6>

              </div>

                <h6 style="margin-bottom:var(--space-2); text-align:right;">Tech Stack</h6>

                  <span class="tag">Python</span>
                  <span class="tag">LLMs</span>
                  <span class="tag">LangChain</span>
                  <span class="tag">Vector DB</span>
                  <span class="tag">Cloud Computing</span>

          <!-- Live eval runner (Phase 3) -->
          <div class="card mt-6">
            <div class="card-header">
              <span class="card-title">Live Evaluation Runner (Phase 3)</span>
              <span class="badge badge-primary">RAGAS Pipeline</span>
            </div>
            <p class="text-muted mb-4" style="font-size:0.875rem;">
              Run the 24-question RAGAS evaluation pipeline against the live backend.
              Returns faithfulness, answer relevancy, context precision/recall scores per agent.
              Caches results in-memory for the /api/analytics endpoint to serve.
            </p>
            <div class="flex gap-2 mb-4">
              <button class="btn btn-primary" id="runEvalBtn" onclick="runEvalNow()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Run Evaluation (24 questions)
              </button>
              <button class="btn btn-secondary" onclick="loadLatestEval()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>

            </div>
            <div id="evalResultArea" style="font-family:var(--font-mono); font-size:0.8125rem; background:var(--color-surface-alt); padding:var(--space-4); border-radius:var(--radius-md); min-height:120px; border:1px solid var(--color-border);">

            </div>

          <!-- Cloud deployment cards (Phase 3) -->
          <div class="grid grid-cols-3 mt-6">
            <div class="card card-hover">
              <div class="card-header">

                <span class="badge badge-warning">Ready</span>

              </p>

                deploy/aws/cloudformation.yaml
              </div>
            </div>
            <div class="card card-hover">
              <div class="card-header">
                <span class="card-title">Azure Deployment</span>
                <span class="badge badge-primary">Ready</span>
              </div>
              <p class="text-muted mb-4" style="font-size:0.8125rem;">
                Container Apps + Blob Storage + CDN with Log Analytics
              </p>
              <div class="text-mono text-muted" style="font-size:0.6875rem;">
                deploy/azure/main.bicep
              </div>
            </div>
            <div class="card card-hover">
              <div class="card-header">
                <span class="card-title">GCP Deployment</span>
                <span class="badge badge-success">Ready</span>
              </div>
              <p class="text-muted mb-4" style="font-size:0.8125rem;">
                Cloud Run + Cloud Storage + Load Balancer
              </p>
              <div class="text-mono text-muted" style="font-size:0.6875rem;">

        </div>
      `;

      mountShell('analytics', 'Analytics', 'Home / Workspace / Analytics', mainContent, '');

      // Animate counters
      animateCounters();
    }

    function animateCounters() {
      document.querySelectorAll('.stat-value[data-target]').forEach(el => {
        const target = parseFloat(el.dataset.target);
        const decimals = parseInt(el.dataset.decimals || '1');
        const suffix = el.dataset.suffix || '';
        const duration = 1200;
        const start = performance.now();

        function tick(now) {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = target * eased;
          el.textContent = value.toFixed(decimals) + suffix;
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }

    function barChart() {
      return [
        { label: 'Mon', value: 142 },
        { label: 'Tue', value: 198 },
        { label: 'Wed', value: 176 },
        { label: 'Thu', value: 211 },
        { label: 'Fri', value: 187 },
        { label: 'Sat', value: 84 },
        { label: 'Sun', value: 96 },
      ];
    }

    function donutSegments(segs) {
      const radius = 15.91549430919;
      let offset = 25;
      return segs.map(s => {
        const dash = (s.value / 100) * 100;
        const el = `<circle cx="21" cy="21" r="${radius}" fill="transparent" stroke="${s.fill}" stroke-width="6" stroke-dasharray="${dash} ${100-dash}" stroke-dashoffset="${offset}" stroke-linecap="round"/>`;
        offset -= dash;
        return el;
      }).join('');
    }

    function lineChartSVG() {
      const data = [80.2, 81.5, 81.1, 82.8, 83.4, 82.9, 84.2, 85.1, 84.8, 86.0, 86.7, 87.4];
      const w = 520, h = 200, pad = 30;
      const max = 90, min = 78;
      const stepX = (w - pad * 2) / (data.length - 1);
      const points = data.map((v, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
        return [x, y];
      });
      const pathD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
      const areaD = `${pathD} L${points[points.length-1][0]},${h-pad} L${points[0][0]},${h-pad} Z`;
      const gridLines = [78, 82, 86, 90].map(v => {
        const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
        return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 3"/>
                <text x="${pad-6}" y="${y+4}" font-size="9" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono">${v}%</text>`;
      }).join('');
      const xLabels = points.map((p, i) => i % 2 === 0 ? `<text x="${p[0]}" y="${h-pad+14}" font-size="9" fill="#94A3B8" text-anchor="middle" font-family="Inter" font-weight="500">W${i+1}</text>` : '').join('');
      const dots = points.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#6366F1" stroke="#fff" stroke-width="2"/>`).join('');

      return `<svg viewBox="0 0 ${w} ${h}" class="line-chart-svg" preserveAspectRatio="none">
        <defs>
          <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
        ${gridLines}
        <path d="${areaD}" fill="url(#areaGrad)"/>
        <path d="${pathD}" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
        ${xLabels}
      </svg>`;
    }

    function latencyRows() {
      return [
        { stage: 'Query embedding', p50: '120ms', p95: '180ms', muted: true },
        { stage: 'Vector search', p50: '180ms', p95: '340ms', muted: true },
        { stage: 'Context retrieval', p50: '90ms', p95: '210ms', muted: true },
        { stage: 'LLM generation', p50: '950ms', p95: '1450ms' },
        { stage: 'Citation formatting', p50: '80ms', p95: '220ms', muted: true },
      ];
    }

    async function runEvalNow() {
      const btn = document.getElementById('runEvalBtn');
      const area = document.getElementById('evalResultArea');
      const originalHTML = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Running eval (24 questions, ~30s)...';
      area.innerHTML = '<span class="text-muted">Running RAGAS evaluation against 24-question gold set...</span>';

      try {
        const isLive = await API.isLive();
        if (!isLive) {
          throw new Error('Backend is offline. Start the Phase 2 backend locally to run live eval.');
        }
        const result = await API.evalRun();
        renderEvalResult(result);
      } catch (err) {
        area.innerHTML = `<div style="color:var(--color-danger);">⚠ ${err.message}</div>
                         <div class="text-muted mt-2" style="font-size:0.75rem;">
                           To run eval: cd backend && uvicorn app.main:app --reload<br/>
                           Then refresh this page and click Run again.
                         </div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    async function loadLatestEval() {
      const area = document.getElementById('evalResultArea');
      try {
        const isLive = await API.isLive();
        if (!isLive) {
          throw new Error('Backend is offline.');
        }
        const result = await API.evalLatest();
        if (result.message) {
          area.innerHTML = `<span class="text-muted">${result.message}</span>`;
        } else {
          renderEvalResult(result);
        }
      } catch (err) {
        area.innerHTML = `<div style="color:var(--color-danger);">⚠ ${err.message}</div>`;
      }
    }

    function renderEvalResult(report) {
      const area = document.getElementById('evalResultArea');
      if (!report || !report.results) {
        area.innerHTML = '<span class="text-muted">No results to display.</span>';
        return;
      }
      const html = `
        <div style="margin-bottom:var(--space-3);">
          <strong>Started:</strong> ${report.started_at}<br/>
          <strong>Duration:</strong> ${report.duration_sec}s · <strong>Questions:</strong> ${report.total_questions}
        </div>
        <div class="grid grid-cols-4 gap-2 mb-4">
          <div><div class="text-muted" style="font-size:0.6875rem;">FAITHFULNESS</div><div style="font-weight:700; color:var(--color-primary);">${report.avg_faithfulness}</div></div>
          <div><div class="text-muted" style="font-size:0.6875rem;">RELEVANCY</div><div style="font-weight:700; color:var(--color-accent);">${report.avg_answer_relevancy}</div></div>
          <div><div class="text-muted" style="font-size:0.6875rem;">CTX PRECISION</div><div style="font-weight:700; color:var(--color-success);">${report.avg_context_precision}</div></div>
          <div><div class="text-muted" style="font-size:0.6875rem;">CTX RECALL</div><div style="font-weight:700; color:var(--color-warning);">${report.avg_context_recall}</div></div>
        </div>
        <div class="text-muted mb-2" style="font-size:0.6875rem;">PER-QUESTION RESULTS (top 5):</div>
        ${report.results.slice(0, 5).map((r, i) => `
          <div style="padding:var(--space-2) 0; border-bottom:1px solid var(--color-border);">
            <div class="flex items-center justify-between">
              <span class="badge badge-${r.agent}">${r.agent.toUpperCase()}</span>
              <span style="font-weight:700; color:var(--color-${r.overall > 0.7 ? 'success' : r.overall > 0.4 ? 'warning' : 'danger'});">
                ${(r.overall * 100).toFixed(1)}%
              </span>
            </div>
            <div style="margin-top:4px; font-size:0.75rem; color:var(--color-text-secondary);">
              ${r.question}
            </div>
            <div class="text-muted" style="font-size:0.6875rem; margin-top:2px;">
              ${r.latency_ms}ms · sources: ${r.sources.length}
            </div>
          </div>
        `).join('')}
      `;
      area.innerHTML = html;
    }
